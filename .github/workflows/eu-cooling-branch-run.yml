# TEMPORARY (remove before merging): fetch Eurostat cooling degree days on this branch
# and report the result as an annotation, because the building session can't reach Eurostat.
name: EU cooling degree days (branch run)
on:
  push:
    branches: [europe-ac-toggle]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and report
        run: |
          set +e
          python3 scripts/update-eu-cooling.py > out.log 2>&1
          echo "::notice title=log::$(tr '\n' ' ' < out.log)"
          python3 -c "import json;print('::notice title=data::'+json.dumps(json.load(open('src/data/euCoolingDegreeDays.json')),separators=(',',':')))" || true
