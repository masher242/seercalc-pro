# TEMPORARY (remove before merging): runs the EU price refresh on the eu-latest branch
# and commits the result back to that branch, because the session that built this
# can't reach Eurostat or trigger workflows by hand.
name: EU prices (branch run)

on:
  push:
    branches: [eu-latest]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Eurostat and rebuild map data
        run: python3 scripts/update-eu-rates.py | tee eu-refresh.log
      - name: Commit result to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/euHouseholdRates.json eu-refresh.log
          git diff --cached --quiet && exit 0
          git commit -m "Refresh EU prices from Eurostat (branch run)"
          git push
