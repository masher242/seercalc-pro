# TEMPORARY (remove before merging): runs the EU price refresh on the eu-latest branch
# and commits the result back to that branch, because the session that built this
# can't reach Eurostat or trigger workflows by hand.
name: EU prices (branch run)

on:
  push:
    branches: [eu-latest]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Eurostat and rebuild map data
        run: |
          set +e
          curl -sS -o /dev/null -w "eurostat http %{http_code}\n" "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nrg_pc_204?freq=S&siec=E7000&nrg_cons=KWH2500-4999&unit=KWH&tax=I_TAX&currency=EUR&time=2026-S1" > eu-refresh.log 2>&1
          python3 scripts/update-eu-rates.py >> eu-refresh.log 2>&1
          echo "exit $?" >> eu-refresh.log
          while IFS= read -r line; do echo "::notice title=refresh::$line"; done < eu-refresh.log
      - name: Report the new data
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('src/data/euHouseholdRates.json'))
          print("::notice title=data::" + json.dumps(d, separators=(',', ':'), ensure_ascii=True))
          PY
